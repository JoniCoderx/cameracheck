<style>

.mut{color:var(--mut)}
.center{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.phone .scr img{position:absolute;left:0;top:110px;width:100%;display:block}

.tlabel .chip .ic{width:52px;height:52px;border-radius:16px;background:var(--lime);display:grid;place-items:center}
.tlabel .chip svg{width:32px;height:32px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tlabel h2{margin-top:22px;font-size:104px;font-weight:800;letter-spacing:-.045em;line-height:1}

.wall .card{position:absolute;width:300px;height:520px;border-radius:34px;overflow:hidden;background:#141417;box-shadow:0 0 0 2px #2a2a30,0 30px 80px rgba(0,0,0,.6)}

.url{display:inline-block;padding:26px 52px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:84px;font-weight:800;letter-spacing:-.035em;box-shadow:0 30px 100px rgba(205,245,69,.35)}

.flash{position:absolute;inset:0;background:var(--lime);pointer-events:none;opacity:0}
</style></head><body>
<div id="stage"></div>
<script>

document.querySelectorAll('.logo-tile svg').forEach((s) => { s.setAttribute('width', '100%'); s.setAttribute('height', '100%'); });

    const h = $('h1');
    const seq = [[0, STR.h[0]], [1.5, STR.h[1]], [2.0, STR.h[2]], [2.5, STR.h[3]], [2.75, STR.h[4]]];
    let cur = seq[0]; for (const s of seq) if (t >= s[0]) cur = s;
    if (t < 1.5) {

      const parts = STR.h0parts; const n = t < .5 ? 1 : t < 1 ? 2 : 3;
      h.innerHTML = parts.slice(0, n).map((p, i) => (i === 1 ? `<span class="hl">${p}</span>` : p)).join(i => '').replace(/,/g, '');
      h.innerHTML = parts.slice(0, n).map((p, i) => (i === 1 ? `<span class="hl">${p}</span>` : p)).join('<br>');
      const at = [0, .5, 1][n - 1]; const k = eo(prog(t, at, at + .25));
      T(h, `scale(${1.25 - .25 * back(prog(t, at, at + .3))}) translateZ(${(1 - k) * 200}px)`, 1);
    } else {
      h.innerHTML = `${STR.h0parts[0]}<br><span class="hl">${cur[1]}</span><br>${STR.h0parts[2]}`;
      const k = prog(t, cur[0], cur[0] + .18);
      T(h, `scale(${1.12 - .12 * eo(k)}) rotateX(${(1 - eo(k)) * 30}deg)`, 1);
    }
    return;
  }

    show('logo');
    const k = prog(t, 3, 3.6), push = prog(t, 4.6, 5);

    const w = eo(prog(t, 3.25, 3.7)); T($('lword'), `translateY(${(1 - w) * 80}px)`, w);
    const g = eo(prog(t, 3.6, 4.0)); T($('ltag'), `translateY(${(1 - g) * 40}px)`, g);
    S.logo.style.transform = `translateZ(${eio(push) * 900}px)`; S.logo.style.opacity = 1 - eio(prog(t, 4.8, 5));

    return;
  }
  S.logo.style.transform = ''; S.logo.style.opacity = 1;
  if (t < 18) {
    show('tool');
    const i = Math.min(TOOLS.length - 1, Math.floor(t - 5)), lt = t - 5 - i;
    const [shot, icon] = TOOLS[i], dir = i % 2 ? -1 : 1;
    if ($('timg').dataset.n !== shot) { $('timg').src = SHOT(shot); $('timg').dataset.n = shot; $('tic').innerHTML = svg(icon); $('tname').textContent = STR.tools[i][0]; $('tsub').textContent = STR.tools[i][1]; $('tnum').textContent = String(i + 1).padStart(2, '0') + ' / ' + TOOLS.length; }
    const kin = eo(clamp(lt / .32)), kout = eio(prog(lt, .86, 1));
    const flip = i % 4 === 3;
    const ry = flip ? (1 - kin) * 180 * dir : (1 - kin) * 55 * dir;
    const tx = flip ? 0 : (1 - kin) * 700 * dir - kout * 700 * dir;
    const drift = Math.sin(lt * Math.PI) * 6 * dir;
    T($('phone'), `translate3d(${tx}px, ${70 + (1 - kin) * 120}px, ${-kout * 400}px) rotateY(${ry - kout * 40 * dir + drift}deg) rotateX(${6 - kin * 4}deg) rotateZ(${(1 - kin) * -6 * dir}deg) scale(${.9 + .05 * kin})`, 1 - kout * .9);
    const img = $('timg'); const h = img.naturalHeight / img.naturalWidth * 596 || 1300; const room = Math.max(0, h - 1146);
    img.style.transform = `translateY(${-room * eio(prog(lt, .25, .95)) * Math.min(1, 900 / Math.max(room, 1))}px)`;
    const tk = eo(prog(lt, .02, .25)); T($('tname'), `translateY(${(1 - tk) * 60}px)`, tk * (1 - kout)); T($('tchip'), `scale(${.8 + .2 * tk})`, tk * (1 - kout));
    const sk = eo(prog(lt, .15, .4)); T($('tsub'), `translateY(${(1 - sk) * 30}px)`, sk * (1 - kout));
    return;
  }
  if (t < 19) {
    // fast 3D wall of every tool zooming out
    show('free'); $('fw').innerHTML = '';
    layoutWall(t, 18, 19, true); return;
  }
  if (t < 22) {
    show('priv');
    const k = prog(t, 19, 19.6);
    T($('lock'), `rotateY(${(1 - eo(k)) * 260 + Math.sin(t * 1.4) * 14}deg) scale(${.5 + .5 * back(k)})`, clamp(k * 3));
    $('shackle').style.transform = `translateY(${-14 * (1 - eo(prog(t, 19.7, 20)))}px)`;
    const a = eo(prog(t, 19.4, 19.8)); T($('p1'), `translateY(${(1 - a) * 60}px)`, a);
    const b2 = eo(prog(t, 20.5, 20.9));
    $('p2').textContent = t < 20.5 ? STR.p2 : STR.p3;
    T($('p2'), `translateY(${(1 - (t < 20.5 ? eo(prog(t, 19.7, 20.1)) : b2)) * 40}px)`, t < 20.5 ? eo(prog(t, 19.7, 20.1)) : b2);
    return;
  }
  if (t < 25) {
    show('lang');
    const ring = $('ring'), items = [...ring.children], n = items.length, Rr = 470;
    const rot = (t - 22) * 50;
    items.forEach((b, i) => {
      const a = i / n * 360 + rot, rad = a * Math.PI / 180, z = Math.cos(rad);
      const band = [-760, 520, -540, 760, -330, 330, -820][i % 7]; const y = band + Math.sin(t * 1.2 + i) * 16;
      b.style.transform = `translate(-50%,-50%) rotateY(${a}deg) translateZ(${Rr}px) translateY(${y}px)`;
      b.style.opacity = (.25 + .75 * Math.max(0, z)) * eo(prog(t, 22, 22.5));
      b.style.color = z > .9 ? '#cdf545' : '#f3f3ef';
    });
    ring.style.transform = `rotateX(-8deg)`;
    const a = back(prog(t, 22.1, 22.5)); T($('lg1'), `scale(${.6 + .4 * a})`, clamp(a));
    const c = eo(prog(t, 22.6, 23)); T($('lg2'), `translateY(${(1 - c) * 30}px)`, c);
    return;
  }
  if (t < 28) {
    show('free');
    const words = STR.f; const idx = Math.min(words.length - 1, Math.floor((t - 25) / 1));
    const lt = (t - 25) - idx;
    $('fw').innerHTML = idx === words.length - 1 ? `<span class="hl">${words[idx]}</span>` : words[idx];
    const k = prog(lt, 0, .22);
    T($('fw'), `scale(${1.5 - .5 * eo(k)}) translateZ(0)`, eo(clamp(k * 2)));

  T($('ctile'), `rotateY(${(1 - spring(k)) * 140}deg) scale(${.4 + .6 * spring(k) + .08 * pulse(t, 31.5, .35)})`, clamp(k * 4));
  const a = eo(prog(t, 28.3, 28.7)); T($('c1'), `translateY(${(1 - a) * 50}px)`, a);
  const u = back(prog(t, 28.6, 29.0)); T($('curl'), `scale(${.6 + .4 * u + .05 * beatPulse(t, 29, 31.5) + .1 * pulse(t, 31.5, .4)})`, clamp(u * 2));
  const c = eo(prog(t, 29.1, 29.5)); T($('c2'), `translateY(${(1 - c) * 30}px)`, c);
  [...$('orbs').children].forEach((o, i) => {
    const n = TOOLS.length, ang = i / n * Math.PI * 2 + (t - 28) * .55, rx = 470, ry = 820;
    const z = Math.sin(ang); const e = eo(prog(t, 28 + i * .03, 28.6 + i * .03));
    o.style.transform = `translate3d(${Math.cos(ang) * rx * e}px, ${Math.sin(ang) * ry * .62 * e}px, ${z * 200}px) rotateY(${Math.cos(ang) * 30}deg) scale(${.7 + .3 * e})`;
    o.style.opacity = (.35 + .4 * (z + 1) / 2) * e;
  });

  const out = prog(t, 32.2, 32.9); S.cta.style.opacity = 1 - out; bars.style.opacity = .16 * (1 - out);

function layoutWall(t, a, b, intro) {
  const cards = [...$('wall').children], cols = 5;
  const p = prog(t, a, b);
  cards.forEach((c, i) => {
